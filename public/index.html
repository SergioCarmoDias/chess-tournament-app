<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champions for Christ - Sports Fiesta</title>
  <style>
    :root {
      --bg-color: #f8fafc; /* Clean, light modern background */
      --card-bg: #ffffff;
      --primary-color: #0b1329; /* Deep navy from your logo */
      --gold-color: #ca8a04; /* Rich gold accent */
      --text-dark: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 550px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    /* Logo Image Styling */
    .brochure-banner {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 30px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 4px 12px rgba(11, 19, 41, 0.15);
    }

    .btn:hover {
      background: #1e293b;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #ffffff;
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #f1f5f9;
    }

    .footer-motto {
      margin-top: 30px;
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: var(--gold-color);
      font-weight: 600;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Place your uploaded logo image here (e.g., in a public/images folder) -->
    <img src="/images/champions-logo.png" alt="Champions for Christ" class="brochure-banner">

    <div class="btn-group">
      <a href="/registration" class="btn">Enter Tournament Manager</a>
      <a href="/winners" class="btn btn-secondary">View Hall of Fame</a>
    </div>

    <div class="footer-motto">
      "Faith. Fun. Fellowship. Glory to God!"
    </div>
  </div>

</body>
</html>
